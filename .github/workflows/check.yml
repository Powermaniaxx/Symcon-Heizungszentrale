name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find Center tests -name '*.php' -print0 | xargs -0 -n1 php -n -l
      - name: Check weather rules
        run: php -n tests/weather-rules.php
      - name: Check local learning and safety
        run: php -n tests/learning.php
      - name: Check module safety
        run: php -n tests/module-safety.php
  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish checked version 1.9.2
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = context.sha;
            const head = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            if (head.data.commit.sha !== sha) throw new Error('Main changed; release skipped.');
            const file = await github.rest.repos.getContent({owner, repo, path: 'library.json', ref: sha});
            const version = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8')).version;
            if (version !== '1.9.2') return;
            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              core.info('Release already exists.'); return;
            } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: sha,
              name: `Heizungszentrale ${version}`, draft: false, prerelease: false,
              body: 'Die Überschrift Heizungszentrale innerhalb der Kachel wird automatisch ausgeblendet, solange Symcon 9.0 läuft. Unter anderen Symcon-Versionen bleibt sie sichtbar. Untertitel und Bedienung bleiben erhalten. PHP-Syntax, Wetter-, Lern- und Modultests einschließlich Versionsgrenzen erfolgreich. Keine realen Geräte angesprochen.'});

